# Non-secret RDS connection details. db_host comes from the Terraform output
# `db_address` after `terraform apply`; nothing here is sensitive.
db_host: "REPLACE_WITH_TERRAFORM_db_address_OUTPUT"
db_port: 5432
db_name: "northwind_deliveries"
db_username: "northwind"

# Encrypt the real value with: ansible-vault encrypt_string --name 'db_password' <password>
