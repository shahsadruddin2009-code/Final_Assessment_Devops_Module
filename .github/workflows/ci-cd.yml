name: Northwind Delivery — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shahsadruddin2009-code/northwind-delivery
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run ruff
        run: |
          python -m pip install ruff
          ruff check .

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: northwind
          POSTGRES_PASSWORD: northwind
          POSTGRES_DB: northwind_deliveries
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          TEST_POSTGRES_URL: postgresql+psycopg2://northwind:northwind@localhost:5432/northwind_deliveries
        run: python -m pytest tests --junitxml=reports/pytest-results.xml --html=reports/pytest-report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/

  test-go:
    name: Run Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: northwind
          POSTGRES_PASSWORD: northwind
          POSTGRES_DB: northwind_deliveries
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum

      - name: Vet and test
        working-directory: go
        env:
          TEST_POSTGRES_URL: postgres://northwind:northwind@localhost:5432/northwind_deliveries?sslmode=disable
        run: |
          go vet ./...
          go test -race -cover ./...

  build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: [test, test-go]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Python image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Go image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./go.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:go-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke Test Container
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run container
        run: |
          docker run -d --name northwind -p 8000:8000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5

      - name: Health check
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/deliveries
          curl -sf http://localhost:8000/deliveries/NL-1001

      - name: Clean up
        if: always()
        run: docker rm -f northwind || true

  deploy:
    name: Deploy to Local Kubernetes
    runs-on: self-hosted
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          export IMAGE_TAG=${{ github.sha }}
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/northwind-delivery --timeout=120s
          ./k8s/deploy.sh

  dashboard:
    name: Build Test Dashboard
    runs-on: ubuntu-latest
    needs: [test, build, smoke-test]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pytest report
        uses: actions/download-artifact@v4
        with:
          name: pytest-report
          path: reports/

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: northwind-dashboard
          path: dashboard/
