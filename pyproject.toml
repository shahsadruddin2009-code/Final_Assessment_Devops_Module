[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = []

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".gopath", "go"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit security checks
]
ignore = [
    "S104",  # binding 0.0.0.0 is intentional for containers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S310"]      # assert is the point of tests; URLs come from the local test fixture
"scripts/*" = ["S603", "S607"]    # subprocess use is deliberate and arguments are fixed
"scripts/generate_dashboard.py" = ["S314", "E501"]  # XML is our own pytest output; long lines are HTML/CSS
